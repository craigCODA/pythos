[package]
name = "pyth-codegen-x86_64"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
pythos-shared = { path = "../../shared", features = ["pyth-tig"] }

[dev-dependencies]
pythos-shared = { path = "../../shared", features = ["pyth-tig", "pyth-tig-test-support"] }
