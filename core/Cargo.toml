[package]
name = "pythos-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["pyth-tig-default"]
pyth-tig-default = []
legacy-shell = []
pyth-tig-session-manager-fault-test = []
# `verify` reproduces the boot-acceptance behavior: run the full proof sequence
# and exit via QEMU isa-debug-exit. Without it (the default), a normal boot
# enters a persistent event loop instead of exiting (ADR 0049).
verify = []
evidence-terminal = ["verify"]
# `hardware-probe` builds a no-write real-hardware diagnostic image. It scans
# PCI config space for storage-controller identity and then halts.
hardware-probe = []
# `hardware-probe-emmc-write` is an explicit destructive test image. It depends
# on `hardware-probe` and writes one fixed sacrificial eMMC sector.
hardware-probe-emmc-write = ["hardware-probe"]
# `sdhci-emmc-backend` is an opt-in polling PIO production backend. It is not
# enabled by default and does not alter the probe gates.
sdhci-emmc-backend = []
# Acceptance-only one-shot PythTIG launch control. Normal production builds do
# not compile sector-96 test selection or prepare graph runtime address spaces.
pythtig-phase2-test = []
# Acceptance-only Phase 13 package-format check. This validates INIT.PAK
# package-source records and package artifact parsing without installing,
# launching, or mutating package/object state.
phase13-package-test = []
# Opt-in physical keyboard bring-up diagnostic. This inserts a keyboard-only
# wake gate into the verify boot after the Phase 6 cinematic frame; it is not
# enabled by default and is not a general input-service implementation.
physical-wake-diagnostic = []
# Opt-in physical input event diagnostic. This samples keyboard bytes after the
# Phase 6 cinematic frame, normalizes a fixed key set, and reports events; it is
# not enabled by default and is not shell keyboard control.
physical-input-event-diagnostic = []
# Opt-in normal-boot physical keyboard console ingress. PythCore keeps i8042
# port access in kernel mode and exposes only bounded console bytes through the
# existing object-shell console syscall.
physical-keyboard-console = []

[dependencies]
pythos-shared = { path = "../shared", features = ["pyth-tig"] }

[dev-dependencies]
pythos-shared = { path = "../shared", features = ["pyth-tig-test-support"] }

[[bin]]
name = "pythcore"
path = "src/main.rs"
