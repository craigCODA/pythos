[package]
name = "pythos-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["pyth-tig-default"]
pyth-tig-default = []
legacy-shell = []
pyth-tig-session-manager-fault-test = []
# `verify` reproduces the boot-acceptance behavior: run the full proof sequence
# and exit via QEMU isa-debug-exit. Without it (the default), a normal boot
# enters a persistent event loop instead of exiting (ADR 0049).
verify = []
evidence-terminal = ["verify"]
# `hardware-probe` builds a no-write real-hardware diagnostic image. It scans
# PCI config space for storage-controller identity and then halts.
hardware-probe = []
# `usb-xhci-probe` builds a no-write USB-controller diagnostic image. It scans
# PCI config space for USB controllers, reads xHCI header registers only, and
# then halts.
usb-xhci-probe = []
# `usb-xhci-port-probe` extends the xHCI diagnostic with read-only extended
# capability and port-status register snapshots. It still does not reset the
# controller, allocate rings, enumerate devices, parse HID, or touch storage.
usb-xhci-port-probe = ["usb-xhci-probe"]
# `usb-xhci-swap-probe` renders a post-boot USB swap prompt, then polls the
# read-only xHCI port-status snapshot for a bounded hotplug change. It still
# does not reset the controller, claim ownership, enumerate USB, parse HID, or
# touch storage.
usb-xhci-swap-probe = ["usb-xhci-port-probe"]
# `usb-xhci-command-probe` is the first write/DMA xHCI driver diagnostic. It
# depends on the swap probe's connected-port evidence, then initializes the
# controller command/event rings and proves a bounded Enable Slot completion.
# It still does not address a USB device, configure endpoints, parse HID, move
# a cursor, enable USB interrupts, or touch storage.
usb-xhci-command-probe = ["usb-xhci-swap-probe"]
# `usb-xhci-address-probe` extends the command-ring diagnostic by constructing
# xHCI input/output contexts and issuing one Address Device command for the
# selected hotplugged root-port device. It still does not parse descriptors,
# configure non-control endpoints, parse HID, move a cursor, or touch storage.
usb-xhci-address-probe = ["usb-xhci-command-probe"]
# `usb-xhci-descriptor-probe` extends the address diagnostic with one EP0
# GET_DESCRIPTOR(Device) control transfer. It still does not configure
# non-control endpoints, parse HID reports, move a cursor, or touch storage.
usb-xhci-descriptor-probe = ["usb-xhci-address-probe"]
# `hardware-probe-emmc-write` is an explicit destructive test image. It depends
# on `hardware-probe` and writes one fixed sacrificial eMMC sector.
hardware-probe-emmc-write = ["hardware-probe"]
# `sdhci-emmc-backend` is an opt-in polling PIO production backend. It is not
# enabled by default and does not alter the probe gates.
sdhci-emmc-backend = []
# Acceptance-only one-shot PythTIG launch control. Normal production builds do
# not compile sector-96 test selection or prepare graph runtime address spaces.
pythtig-phase2-test = []
# Acceptance-only Phase 13 package-format check. This validates INIT.PAK
# package-source records and package artifact parsing without installing,
# launching, or mutating package/object state.
phase13-package-test = []
# Opt-in physical keyboard bring-up diagnostic. This inserts a keyboard-only
# wake gate into the verify boot after the Phase 6 cinematic frame; it is not
# enabled by default and is not a general input-service implementation.
physical-wake-diagnostic = []
# Opt-in physical input event diagnostic. This samples keyboard bytes after the
# Phase 6 cinematic frame, normalizes a fixed key set, and reports events; it is
# not enabled by default and is not shell keyboard control.
physical-input-event-diagnostic = []
# Opt-in normal-boot physical keyboard console ingress. PythCore keeps i8042
# port access in kernel mode and exposes only bounded console bytes through the
# existing object-shell console syscall.
physical-keyboard-console = []
# Opt-in normal boot framebuffer breadcrumbs for serial-less physical hardware
# diagnosis. This does not change default boot behavior.
normal-boot-diagnostic = []

[dependencies]
pythos-shared = { path = "../shared", features = ["pyth-tig"] }

[dev-dependencies]
pythos-shared = { path = "../shared", features = ["pyth-tig-test-support"] }

[[bin]]
name = "pythcore"
path = "src/main.rs"
