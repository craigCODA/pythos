name: QEMU Acceptance

on:
  push:
  pull_request:

jobs:
  qemu-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHOS_TEST_BOOT_TIMEOUT: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
          if [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ]; then
            echo "PYTHOS_OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd" >> "$GITHUB_ENV"
          elif [ -f /usr/share/OVMF/OVMF_CODE.fd ]; then
            echo "PYTHOS_OVMF_CODE=/usr/share/OVMF/OVMF_CODE.fd" >> "$GITHUB_ENV"
          else
            echo "missing OVMF code firmware" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        run: |
          set -euxo pipefail
          rustup toolchain install 1.93.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.93.1
          rustup target add x86_64-unknown-uefi x86_64-unknown-none

      - name: Format
        run: cargo fmt --check

      - name: Rust unit tests
        run: |
          cargo test -p pythos-shared
          cargo test -p pythos-shared --features pyth-tig-test-support
          cargo test -p pythos-core
          cargo test -p pythos-core pyth_service_supervisor
          cargo test -p pythc
          cargo test -p pythos-user-pyth-runtime

      - name: PythTIG format harness
        run: python scripts/test-pyth-tig-format.py

      - name: PythTIG compiler harness
        run: |
          mkdir -p target/pyth-tig
          cargo run -p pythc -- build programs/session-manager/main.pyth -o target/pyth-tig/session-manager.tig
          cargo run -p pyth-tig-tool -- verify target/pyth-tig/session-manager.tig
          python scripts/test-pythc.py

      - name: User and PythTIG ELFs
        run: |
          python scripts/build-user-shell.py
          python scripts/verify-user-elf.py
          python scripts/build-pyth-runtime.py
          python scripts/verify-pyth-runtime-elf.py
          python scripts/build-pyth-graph.py

      - name: Clippy
        run: |
          cargo clippy -p pythos-core --target x86_64-unknown-none --features verify -- -D warnings
          cargo clippy -p pythos-core --target x86_64-unknown-none --features verify,sdhci-emmc-backend -- -D warnings
          cargo clippy -p pythos-boot --target x86_64-unknown-uefi -- -D warnings

      - name: Phase 7 script import checks
        run: python -m py_compile scripts/build-pyth-graph.py scripts/build-image.py scripts/build-iso.py scripts/test-pyth-default-boot.py scripts/test-normal-fast-boot.py scripts/test-object-shell.py scripts/test-com2-shell-transport.py scripts/test-normal-boot-interactive.py scripts/test-pyth-graph-runtime.py scripts/test-pyth-graph-object-flow.py scripts/test-pyth-native-codegen.py scripts/pyth_cross_target.py scripts/test-pyth-cross-target.py scripts/prepare-pyth-physical-image.py scripts/verify-pyth-physical-log.py

      - name: Python harness tests
        run: python -m unittest tests.test_iso_image tests.test_boot_marker_contract tests.test_qemu_exit tests.test_ci_workflow tests.test_build_orchestration tests.test_verify_user_elf tests.test_interface_compatibility_freeze

      - name: QEMU milestone acceptance
        run: |
          python scripts/test-pyth-graph-runtime.py
          python scripts/test-pyth-graph-object-flow.py
          python scripts/test-pyth-native-codegen.py
          python scripts/test-pyth-cross-target.py --unit-only
          python scripts/test-pyth-cross-target.py --automated-only
          python scripts/test-pyth-default-boot.py
          python scripts/test-object-shell.py
          python scripts/test-normal-fast-boot.py
          python scripts/test-boot.py --slice phase-6-complete --timeout 60
          python scripts/test-boot.py --slice graceful-audio-fallback --no-audio-device --timeout 60
          python scripts/test-boot.py --slice milestone-1 --timeout 60
          python scripts/test-boot.py --slice milestone-1 --media iso --timeout 60
          python scripts/test-persistent-storage.py

      - name: PythTIG physical evidence tooling
        run: |
          python scripts/verify-pyth-physical-log.py --self-test
          python scripts/prepare-pyth-physical-image.py --manifest target/pyth-physical-image-manifest.json
          python scripts/verify-pyth-physical-log.py --manifest target/pyth-physical-image-manifest.json --log target/pyth-cross-target-ahci.log --backend ahci --target-id qemu-ahci-import-smoke --output target/pyth-physical-log-verification-ahci.json

      - name: Full QEMU slice handoff suite
        run: python -m unittest tests.boot_core_handoff

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-serial-log
          path: target/boot-serial.log
          if-no-files-found: ignore
