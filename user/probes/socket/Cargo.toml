[package]
name = "pythos-user-socket-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
pythos-shared = { path = "../../../shared" }
pythos-user-link-layer-probe = { path = "../link-layer" }
pythos-user-arp-probe = { path = "../arp" }
pythos-user-ipv4-probe = { path = "../ipv4" }
pythos-user-tcp-probe = { path = "../tcp" }
embedded-io = { version = "=0.7.1", default-features = false, optional = true }
embedded-tls = { version = "=0.19.0", default-features = false, features = ["rustpki"], optional = true }
rand_core = { version = "=0.6.4", default-features = false, optional = true }
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"], optional = true }

[features]
secure-transport = ["dep:embedded-io", "dep:embedded-tls", "dep:rand_core", "dep:sha2"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "socket-probe"
path = "src/main.rs"
